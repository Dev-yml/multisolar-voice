# Fly.io config for the Voice Agent server. Mumbai (bom) = closest to Tata and to Supabase Mumbai.
# Change the app name to the one you create: fly apps create <name>
app = "multisolar-voice-agent"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.voice"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Phone calls can come in at any time — never sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
